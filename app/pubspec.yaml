name: ratatosk
description: "Ratatosk: a messenger app built on ConnectRPC"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  # Generated clients and the Connect protocol itself.
  connectrpc: ^2.0.0
  protobuf: ^6.0.0
  fixnum: ^1.1.0
  # State: get_it for dependency injection, watch_it for reactive widgets.
  # Both are from the flutter_it family (flutter-it.dev).
  get_it: ^9.3.0
  watch_it: ^2.5.0
  # The session token outlives the process.
  shared_preferences: ^2.5.2
  # Invitation links: ratatosk://join/<code> and https://host/join/<code>.
  app_links: ^7.0.0
  # Attachments on every platform, including desktop and web.
  file_selector: ^1.0.3
  intl: ^0.20.2
  # Native share sheets; falls back to copying the link on desktop.
  share_plus: ^13.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
