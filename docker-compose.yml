name: ratatosk

services:
  ratatosk:
    build:
      # Arcane builds from this repository on the host, the same way ktd does:
      # the image is built on wowbagger itself, so no registry push is needed.
      context: .
      dockerfile: Dockerfile
    # An explicit tag naming the project and service, which is what Arcane
    # expects for a locally-built image: the convention in the wowbagger repo is
    # `<project>-<service>:latest` (this is also Compose's own default here).
    # Without it the deploy tries to pull a nonexistent registry image.
    image: ratatosk-ratatosk:latest
    container_name: ratatosk
    restart: unless-stopped
    # Bound on all interfaces because Caddy reaches services through
    # host.docker.internal (the docker bridge gateway); a loopback-only bind
    # returns 502. This port must stay blocked from outside by the Netcup
    # firewall and the DOCKER-USER drop rule — see wowbagger AGENTS.md.
    ports:
      - "18093:8080"
    environment:
      # Must be the public HTTPS origin, and must carry the RATATOSK_ prefix the
      # server's env lookup uses: it is what invite links and attachment urls
      # point at, and Web Push refuses to work over plain http. Without it the
      # server falls back to http://localhost:<port>, so every invitation link
      # it hands out is unusable by the recipient.
      RATATOSK_PUBLIC_URL: https://ratatosk.flatout.works
    # The secrets: RATATOSK_DATA_KEY (seals every record — back it up),
    # RATATOSK_VAPID_* (notifications) and RATATOSK_GOOGLE_CLIENT_ID.
    # Generate with ./deploy/gen-secrets.sh; keep a copy off the server.
    #
    # `./.env` is Arcane's *project environment*, not a file in this repository.
    # It must not be a repo file: the GitOps sync mirrors the repo into this
    # directory, so an untracked secrets file placed there is deleted by the next
    # sync — which is exactly how the data key was lost once, leaving an intact
    # database that could not be opened. Arcane stores envContent server-side and
    # rewrites .env; it survives syncs.
    #
    # `required: false` so a deployment without secrets still starts (with
    # notifications off) instead of refusing to boot.
    env_file:
      - path: ./.env
        required: false
    volumes:
      # THE important line: the database, its WAL and uploaded blobs live here.
      # Without a volume at this exact path, every container replace silently
      # starts with an empty database (verified: the user count drops to zero).
      - ratatosk-data:/var/lib/ratatosk

volumes:
  # A named volume, not a host path: Docker seeds it with the ownership the
  # image created (/var/lib/ratatosk, uid 10001), so the unprivileged server can
  # write to it without anything running as root.
  ratatosk-data:
