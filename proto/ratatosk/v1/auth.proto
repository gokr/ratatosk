syntax = "proto3";

package ratatosk.v1;

import "google/protobuf/timestamp.proto";
import "ratatosk/v1/common.proto";

option go_package = "github.com/gokr/ratatosk/server/gen/ratatosk/v1;ratatoskv1";

// Account creation, sign-in and profile management.
//
// Register and Login are the only procedures that work without a bearer
// token; everything else needs `Authorization: Bearer <token>`, which the
// server resolves into the calling user.
service AuthService {
  // Create an account and return a session token.
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
  // Exchange username and password for a session token.
  rpc Login(LoginRequest) returns (LoginResponse) {}
  // Revoke the token used for this call.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {}
  // The calling user, refreshed (presence, profile edits).
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {}
  // Edit display name, bio, accent color or profile picture.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {}
  // Rotate the password; other sessions stay valid.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {}
  // Delete the calling account and everything that belongs to it.
  //
  // Requires the password to be repeated in the request: an action this
  // destructive must not be reachable by anyone who merely has a live session
  // (a shared laptop, a stolen token). It is the one irreversible thing a user
  // can ask for, so the same check the operator's --delete-account does applies.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse) {}

  // Turn a verified social sign-in into an account.
  //
  // Reached only through the server's own OAuth callback: the browser comes back
  // with an opaque pending token, and the password (if any) is chosen here. An
  // invitation is required, because this server is invite-only.
  rpc FinishGoogleSignUp(FinishGoogleSignUpRequest) returns (FinishGoogleSignUpResponse) {}
  // Whether this server offers Google sign-in at all, and the client id and
  // callback the browser needs. Public: it is shown before anybody signs in.
  rpc GoogleSignInConfig(GoogleSignInConfigRequest) returns (GoogleSignInConfigResponse) {}
  // The sign-in methods this account has, so Settings can show them.
  rpc SignInMethods(SignInMethodsRequest) returns (SignInMethodsResponse) {}
  // Where to send the browser to connect a Google account to *this* account.
  //
  // Distinct from signing in: the attempt is bound to the caller, and its callback
  // attaches the identity here rather than issuing a session. An identity already
  // connected elsewhere is refused rather than moved.
  rpc GoogleLinkUrl(GoogleLinkUrlRequest) returns (GoogleLinkUrlResponse) {}
  // Removes the connected Google account. Refused when it is the only way in.
  rpc UnlinkGoogle(UnlinkGoogleRequest) returns (UnlinkGoogleResponse) {}
}

message RegisterRequest {
  // 3-32 chars, lowercase letters, digits, ".", "_" or "-".
  string username = 1;
  string password = 2;
  // Defaults to the username when empty.
  string display_name = 3;
  // The invitation this account is being created with, if any.
  //
  // Sent at registration rather than left for a separate call, because a one-use
  // invitation was consumed by the *separate* redemption afterwards — so a new person
  // arriving on a one-use link used it up admitting themselves and was then told it
  // was exhausted. An invitation belongs to the act of joining, which is this call.
  string invite_code = 4;
}

message RegisterResponse {
  string token = 1;
  User user = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  User user = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message LogoutRequest {}

message LogoutResponse {}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}

message UpdateProfileRequest {
  // Empty keeps the current value.
  string display_name = 1;
  // Optional so that clearing the bio is expressible; absent keeps it.
  optional string bio = 2;
  // Attachment id from ChatService.UploadAttachment; empty keeps the current
  // picture.
  string avatar_attachment_id = 3;
  // Hex color like "#0084ff"; empty keeps the current color.
  string accent_color = 4;
  // Remove the current profile picture.
  bool clear_avatar = 5;
}

message UpdateProfileResponse {
  User user = 1;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message DeleteAccountRequest {
  // The caller's password. Confirms intent rather than merely proving identity.
  string password = 1;
}

message DeleteAccountResponse {
  // What the deletion removed, so the app can state it rather than assert it.
  // The server does not report counts it did not actually delete.
  int32 conversations_deleted = 1;
  int32 messages_deleted = 2;
  int32 attachments_deleted = 3;
}
message FinishGoogleSignUpRequest {
  // The opaque token the OAuth callback handed the app.
  string pending_token = 1;
  // Required: every account has a username, chosen by its owner.
  string username = 2;
  // Defaults to what the provider told us.
  string display_name = 3;
  // Required: this server is invite-only.
  string invite_code = 4;
}

message FinishGoogleSignUpResponse {
  string token = 1;
  ratatosk.v1.User user = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message GoogleSignInConfigRequest {}

message GoogleSignInConfigResponse {
  // False when no client id is configured; the client hides the button.
  bool enabled = 1;
  string client_id = 2;
  // Absolute URL the client sends the browser to.
  string authorization_endpoint = 3;
  // Where Google sends the browser back to.
  string redirect_uri = 4;
}

message SignInMethodsRequest {}

message SignInMethodsResponse {
  // "password" and/or "google".
  repeated string methods = 1;
  // Set when a Google identity is linked, for display.
  string google_email = 2;
}

message GoogleLinkUrlRequest {}

message GoogleLinkUrlResponse {
  // Absolute URL to send the browser to. Empty when Google is not configured here.
  string url = 1;
}

message UnlinkGoogleRequest {}

message UnlinkGoogleResponse {}
